<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Dashboard</title>
</head>
<body>

	{% with messages = get_flashed_messages() %}
		{% if messages %}
			{% for message in messages %}
				<p>{{ message }}</p>
			{% endfor %}			
		{% endif %}
	{% endwith %}

	<a href="/logout">Logout</a>
	<h1>Welcome {{email}}<h1>
</body>
</html>
