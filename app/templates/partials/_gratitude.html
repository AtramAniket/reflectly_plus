<div class="form-group">
    <label for="title">Title</label>
    <input
        id="title"
        type="text"
        name="title"
        placeholder="Give your entry a title"
        required
    >
</div>

<div class="form-group">
    <label for="gratitude_1">What are you grateful for today?</label>
    <textarea
        id="gratitude_1"
        name="gratitude_1"
        placeholder="Something small or big that mattered today..."
        required
    ></textarea>
</div>

<div class="form-group">
    <label for="gratitude_2">Who or what made today better?</label>
    <textarea
        id="gratitude_2"
        name="gratitude_2"
        placeholder="A person, a moment, or even a small comfort..."
        required
    ></textarea>
</div>

<div class="form-group">
    <label for="gratitude_3">Small moment you want to remember</label>
    <textarea
        id="gratitude_3"
        name="gratitude_3"
        placeholder="Capture one quiet detail from today..."
        required
    ></textarea>
</div>

<div class="form-group">
    <label for="mood_score">Mood (1–10)</label>
    <input
        id="mood_score"
        type="number"
        name="mood_score"
        min="1"
        max="10"
        placeholder="e.g. 7"
        required
    >
</div>
