<div class="form-group">
    <label>Title</label>
    <input
        type="text"
        name="title"
        value="{{ entry.title }}"
        required
    >
</div>

<div class="form-group">
    <label>Write your thoughts</label>

    <div id="editor">
        {{ entry.content | safe }}
    </div>

    <input type="hidden" name="content" id="hiddenContent">
</div>

<div class="form-group">
    <label>Mood (1–10)</label>
    <input
        type="number"
        name="mood_score"
        min="1"
        max="10"
        value="{{ entry.mood_score }}"
        required
    >
</div>
