<div class="form-group">
    <label>Title</label>
    <input
        type="text"
        name="title"
        value="{{ entry.title }}"
        required
    >
</div>

<div class="form-group">
    <label>What are you grateful for today?</label>
    <textarea name="gratitude_1" required>{{ entry.structured_content.gratitude_1 }}</textarea>
</div>

<div class="form-group">
    <label>Who or what made today better?</label>
    <textarea name="gratitude_2" required>{{ entry.structured_content.gratitude_2 }}</textarea>
</div>

<div class="form-group">
    <label>Small moment you want to remember</label>
    <textarea name="gratitude_3" required>{{ entry.structured_content.gratitude_3 }}</textarea>
</div>

<div class="form-group">
    <label>Mood (1–10)</label>
    <input
        type="number"
        name="mood_score"
        min="1"
        max="10"
        value="{{ entry.mood_score }}"
        required
    >
</div>
