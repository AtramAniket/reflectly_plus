<aside class="sidebar" id="appSidebar" aria-label="Primary navigation">
    <button class="sidebar-mobile-close" id="sidebarCloseBtn" type="button" aria-label="Close navigation">
        <span data-lucide="x"></span>
    </button>
    <div class="sidebar-brand">
        <div class="sidebar-brand-icon">✦</div>
        <div>
            <h2 class="sidebar-title">Reflectly</h2>
            <p class="sidebar-tagline">Journal with intention</p>
        </div>
    </div>

    <div class="sidebar-section">
        <p class="sidebar-heading">Overview</p>
        <a href="{{ url_for('main.dashboard') }}"
           class="sidebar-link {% if request.endpoint == 'main.dashboard' %}is-active{% endif %}">
            <span class="sidebar-icon" data-lucide="layout-dashboard"></span>
            <span>Dashboard</span>
        </a>
    </div>

    <div class="sidebar-section">
        <p class="sidebar-heading">Journal</p>

        <a href="{{ url_for('journal.create_new_entry', entry_type='simple') }}"
           class="sidebar-link sidebar-sub-link {% if request.endpoint == 'journal.create_new_entry' and request.view_args and request.view_args.get('entry_type') == 'simple' %}is-active{% endif %}">
            <span class="sidebar-icon" data-lucide="pen-square"></span>
            <span>Simple Journal</span>
        </a>

        <a href="{{ url_for('journal.create_new_entry', entry_type='gratitude') }}"
           class="sidebar-link sidebar-sub-link {% if request.endpoint == 'journal.create_new_entry' and request.view_args and request.view_args.get('entry_type') == 'gratitude' %}is-active{% endif %}">
            <span class="sidebar-icon" data-lucide="heart-handshake"></span>
            <span>Gratitude Journal</span>
        </a>

        <a href="{{ url_for('journal.create_new_entry', entry_type='reflection') }}"
           class="sidebar-link sidebar-sub-link {% if request.endpoint == 'journal.create_new_entry' and request.view_args and request.view_args.get('entry_type') == 'reflection' %}is-active{% endif %}">
            <span class="sidebar-icon" data-lucide="sparkles"></span>
            <span>Daily Reflection</span>
        </a>

        <a href="{{ url_for('journal.view_all_entries') }}"
           class="sidebar-link sidebar-sub-link {% if request.endpoint == 'journal.view_all_entries' %}is-active{% endif %}">
            <span class="sidebar-icon" data-lucide="book-open-text"></span>
            <span>All Entries</span>
        </a>
    </div>

    <div class="sidebar-section">
        <p class="sidebar-heading">Habits</p>

        <a href="{{ url_for('habit.create_habit') }}"
           class="sidebar-link sidebar-sub-link {% if request.endpoint == 'habit.create_habit' %}is-active{% endif %}">
            <span class="sidebar-icon" data-lucide="badge-check"></span>
            <span>Habits</span>
        </a>
    </div>

    <div class="sidebar-section">
        <p class="sidebar-heading">Tools</p>

        <a href="{{ url_for('tools.mood_checklist') }}"
           class="sidebar-link {% if request.endpoint == 'tools.mood_checklist' %}is-active{% endif %}">
            <span class="sidebar-icon" data-lucide="brain"></span>
            <span>Mood Check-In</span>
        </a>

        <a href="{{ url_for('tools.anti_procrastination') }}"
           class="sidebar-link {% if request.endpoint == 'tools.anti_procrastination' %}is-active{% endif %}">
            <span class="sidebar-icon" data-lucide="clipboard-pen-line"></span>
            <span>Anti-Procrastination</span>
        </a>
    </div>

    <div class="sidebar-section">
        <p class="sidebar-heading">History</p>

        <a href="{{ url_for('insights.home') }}"
           class="sidebar-link {% if request.endpoint == 'insights.home' %}is-active{% endif %}">
            <span class="sidebar-icon" data-lucide="wand-sparkles"></span>
            <span>Insights</span>
        </a>

        <a href="{{ url_for('main.logs') }}"
           class="sidebar-link {% if request.endpoint == 'main.logs' %}is-active{% endif %}">
            <span class="sidebar-icon" data-lucide="history"></span>
            <span>Logs</span>
        </a>
    </div>

    <div class="sidebar-footer">
        <a href="{{ url_for('auth.logout') }}" class="sidebar-link logout-link">
            <span class="sidebar-icon" data-lucide="log-out"></span>
            <span>Logout</span>
        </a>
    </div>
</aside>
