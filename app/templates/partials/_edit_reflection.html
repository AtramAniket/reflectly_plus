<div class="form-group">
    <label>Title</label>
    <input
        type="text"
        name="title"
        value="{{ entry.title }}"
        required
    >
</div>

<div class="form-group">
    <label>What went well today?</label>
    <textarea name="went_well" required>{{ entry.structured_content.went_well }}</textarea>
</div>

<div class="form-group">
    <label>What felt difficult?</label>
    <textarea name="challenging" required>{{ entry.structured_content.challenging }}</textarea>
</div>

<div class="form-group">
    <label>What will you carry into tomorrow?</label>
    <textarea name="tomorrow" required>{{ entry.structured_content.tomorrow }}</textarea>
</div>

<div class="form-group">
    <label>Mood (1–10)</label>
    <input
        type="number"
        name="mood_score"
        min="1"
        max="10"
        value="{{ entry.mood_score }}"
        required
    >
</div>
