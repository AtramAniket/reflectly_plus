<div class="form-group">
    <label for="title">Title</label>
    <input
        id="title"
        type="text"
        name="title"
        placeholder="Give your entry a title"
        required
    >
</div>

<div class="form-group">
    <label for="went_well">What went well today?</label>
    <textarea
        id="went_well"
        name="went_well"
        placeholder="What felt good, steady, or meaningful today?"
        required
    ></textarea>
</div>

<div class="form-group">
    <label for="challenging">What felt difficult?</label>
    <textarea
        id="challenging"
        name="challenging"
        placeholder="What felt heavy, frustrating, or draining?"
        required
    ></textarea>
</div>

<div class="form-group">
    <label for="tomorrow">What will you do tomorrow?</label>
    <textarea
        id="tomorrow"
        name="tomorrow"
        placeholder="One small intention for tomorrow..."
        required
    ></textarea>
</div>

<div class="form-group">
    <label for="mood_score">Mood (1–10)</label>
    <input
        id="mood_score"
        type="number"
        name="mood_score"
        min="1"
        max="10"
        placeholder="e.g. 5"
        required
    >
</div>
