<div class="form-group">
    <label>Title</label>
    <input type="text" name="title" required>
</div>

<div class="form-group">
    <label>What went well today?</label>
    <textarea name="went_well" required></textarea>
</div>

<div class="form-group">
    <label>What felt difficult?</label>
    <textarea name="challenging" required></textarea>
</div>

<div class="form-group">
    <label>What will you do tomorrow?</label>
    <textarea name="tomorrow" required></textarea>
</div>

<div class="form-group">
    <label>Mood (1-10)</label>
    <input type="number" name="mood_score" min="1" max="10" required>
</div>
