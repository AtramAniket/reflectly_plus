<div class="centered-container">

    <div class="card">

        <form method="POST" class="entry-form">

            <div class="form-group">
                <label>Title</label>
                <input type="text" name="title" placeholder="Give your entry a title" required>
            </div>

            <div class="form-group">
                <label>What’s on your mind?</label>
                <div id="editor"></div>
                <input type="hidden" name="content" id="hidden-content">
            </div>

            <div class="form-group">
                <label>Mood (1–10)</label>
                <input type="number" name="mood_score" min="1" max="10" required>
            </div>

            <button type="submit" class="btn-primary">Save Entry</button>

        </form>

    </div>

</div>

<script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>

<script>
    const quill = new Quill('#editor', {
        theme: 'snow',
        placeholder: 'Write your thoughts...',
        modules: {
            toolbar: [
                [{ header: [1, 2, false] }],
                ['bold', 'italic', 'underline'],
                ['blockquote', 'code-block'],
                [{ list: 'ordered' }, { list: 'bullet' }],
                ['link', 'image']
            ]
        }
    });

    // On submit → copy HTML to hidden input
    document.querySelector('.entry-form').onsubmit = function() {
        document.querySelector('#hidden-content').value = quill.root.innerHTML;
    };
</script>
