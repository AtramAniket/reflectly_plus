{% extends 'base.html' %}

{% block content %}

<h2 class="page-title">Edit Journal Entry</h2>
<p class="subtitle">Update your thoughts and reflect again</p>

<div class="form-container">

    <div class="card">

        <!-- Flash Messages -->
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="flash-container">
                    {% for message in messages %}
                        <div class="flash">{{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <form method="POST" class="entry-form">

            <div class="form-group">
                <label>Title</label>
                <input 
                    type="text" 
                    name="title" 
                    value="{{ journal_entry.title }}" 
                    required
                >
            </div>

            <div class="form-group">
                <label>What’s on your mind?</label>
                <textarea 
                    name="content" 
                    rows="5" 
                    required
                >{{ journal_entry.content }}</textarea>
            </div>

            <div class="form-group">
                <label>Mood (1–10)</label>
                <input 
                    type="number" 
                    name="mood_score" 
                    min="1" 
                    max="10" 
                    value="{{ journal_entry.mood_score }}" 
                    required
                >
            </div>

            <button type="submit" class="btn-primary">Update Entry</button>

        </form>

    </div>

</div>

{% endblock %}
