{% extends 'base.html' %}

{% block content %}

<div class="centered-container">

    <div class="page-header">
        <h2 class="page-title">Edit Entry</h2>
        <p class="page-subtitle">
            Update your thoughts and reflect again
        </p>
    </div>

    <div class="card form-card">

        <form method="POST" class="entry-form">

            <!-- Title -->
            <div class="form-group">
                <label>Title</label>
                <input 
                    type="text" 
                    name="title" 
                    value="{{ journal_entry.title }}" 
                    required
                >
            </div>

            <!-- Content (Quill Editor) -->
            <div class="form-group">
                <label>What’s on your mind?</label>

                <!-- Quill Editor -->
                <div id="editor">
                    {{ journal_entry.content | safe }}
                </div>

                <!-- Hidden input -->
                <input 
                    type="hidden" 
                    name="content" 
                    id="hiddenContent"
                >
            </div>

            <!-- Mood -->
            <div class="form-group">
                <label>Mood (1–10)</label>
                <input 
                    type="number" 
                    name="mood_score" 
                    min="1" 
                    max="10"
                    value="{{ journal_entry.mood_score }}" 
                    required
                >
            </div>

            <!-- Submit -->
            <button type="submit" class="btn-primary">
                Update Entry
            </button>

        </form>

    </div>

</div>

<!-- Quill JS -->
<link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
<script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>

<script>
    const quill = new Quill('#editor', {
        theme: 'snow',
        placeholder: 'Update your thoughts...',
        modules: {
            toolbar: [
                [{ 'header': [1, 2, 3, false] }],
                ['bold', 'italic', 'underline'],
                ['blockquote', 'code-block'],
                [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                ['link', 'image']
            ]
        }
    });

    // Populate hidden input before submit
    document.querySelector('form').onsubmit = function () {
        document.querySelector('#hiddenContent').value = quill.root.innerHTML;
    };
</script>

{% endblock %}
