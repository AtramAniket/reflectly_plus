<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Reflectly</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Quill -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">

    <!-- Global CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">

    <!-- Page CSS -->
    {% block page_css %}{% endblock %}
</head>

<body>
    <button class="mobile-menu-btn" id="mobileMenuBtn" type="button" aria-label="Open navigation" aria-controls="appSidebar" aria-expanded="false">
        <span data-lucide="menu"></span>
    </button>

    <div class="sidebar-overlay" id="sidebarOverlay" aria-hidden="true"></div>

    {% include "partials/_sidebar.html" %}

    <main class="main">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="flash-container">
                    {% for category, message in messages %}
                        <div class="flash flash-{{ category }}">
                            {{ message }}
                        </div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>

    <!-- Lucide icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        lucide.createIcons();
    </script>

    <script>
        const menuBtn = document.getElementById("mobileMenuBtn");
        const closeBtn = document.getElementById("sidebarCloseBtn");
        const sidebar = document.getElementById("appSidebar");
        const overlay = document.getElementById("sidebarOverlay");

        function openSidebar() {
            sidebar?.classList.add("is-open");
            overlay?.classList.add("is-open");
            document.body.classList.add("sidebar-open");
            menuBtn?.setAttribute("aria-expanded", "true");
        }

        function closeSidebar() {
            sidebar?.classList.remove("is-open");
            overlay?.classList.remove("is-open");
            document.body.classList.remove("sidebar-open");
            menuBtn?.setAttribute("aria-expanded", "false");
        }

        menuBtn?.addEventListener("click", openSidebar);
        closeBtn?.addEventListener("click", closeSidebar);
        overlay?.addEventListener("click", closeSidebar);

        document.querySelectorAll(".sidebar-link").forEach(link => {
            link.addEventListener("click", closeSidebar);
        });

        window.addEventListener("keydown", event => {
            if (event.key === "Escape") {
                closeSidebar();
            }
        });

        window.addEventListener("resize", () => {
            if (window.innerWidth > 900) {
                closeSidebar();
            }
        });
    </script>

    <script>
        setTimeout(() => {
            document.querySelectorAll('.flash').forEach(flash => {
                flash.classList.add('flash-hide');
            });
        }, 3000);
    </script>
</body>
</html>
