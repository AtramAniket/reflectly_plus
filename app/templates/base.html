<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reflectly</title>
    <style>
        body {
            display: flex;
            margin: 0;
            font-family: Arial;
            display: flex;
            align-items: stretch;
        }

        .sidebar {
            width: 220px;
            min-height: 100vh;
            background: #1e293b;
            color: white;
            padding: 20px;
        }

        .sidebar a {
            color: white;
            display: block;
            margin: 10px 0;
            text-decoration: none;
        }

        .sidebar a.active {
            background: #334155;
            padding: 5px;
            border-radius: 5px;
        }

        .main {
            flex: 1;
            padding: 20px;
            background: #f1f5f9;
        }

        .card {
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .card:hover {
            transform: translateY(-2px);
            transition: 0.2s;
        }
    </style>
</head>

<body>

<div class="sidebar">
    <h2>Reflectly</h2>
    <a href="/">Dashboard</a>
    <a href="{{ url_for('journal.create_new_entry') }}">New Entry</a>
    <a href="{{ url_for('auth.logout') }}">Logout</a>
</div>

<div class="main">
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
                <p>{{ message }}</p>
            {% endfor %}            
        {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
</div>

</body>
</html>
