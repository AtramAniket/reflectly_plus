{% extends 'base.html' %}

{% block content %}
<div class="centered-container">
    <div class="page-header">
        <h1 class="page-title">Create Habit</h1>
        <p class="page-subtitle">
            Add a habit you want to track consistently over time.
        </p>
    </div>

    <div class="card form-card">
        <form method="POST" class="entry-form">
            <div class="form-group">
                <label for="name">Habit name</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Example: Read for 20 minutes"
                    required
                >
            </div>

            <button type="submit" class="btn-primary habit-submit-btn">
                Create Habit
            </button>
        </form>
    </div>
</div>
{% endblock %}
