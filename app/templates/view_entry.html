{% extends 'base.html' %}

{% block content %}

<div class="reading-container">

    <!-- HERO IMAGE -->
    <div class="entry-hero">
        <img src="{{ entry.image_url or 'https://picsum.photos/1200/400' }}" alt="Entry Image">

        <div class="entry-hero-overlay">
            <h1 class="entry-title">{{ entry.title }}</h1>
            <p class="entry-date">{{ entry.created_at.strftime('%B %d, %Y') }}</p>
        </div>
    </div>


    <!-- CONTENT CARD -->
    <div class="card entry-view">

        <div class="entry-content-full">
            {{ entry.content | safe }}
        </div>

        <div class="entry-footer">
            <span class="entry-mood-badge">
                Mood: {{ entry.mood_score }}/10
            </span>
        </div>

    </div>


    <!-- ACTIONS -->
    <div class="entry-actions">

        <div class="entry-actions-left">
            
            <a href="{{ url_for('journal.edit_entry', entry_id=entry.id) }}" class="btn-secondary">
                ✏️ Edit
            </a>

            <a href="{{ url_for('journal.delete_entry', entry_id=entry.id) }}" class="btn-danger">
                🗑 Delete
            </a>

        </div>

        <a href="{{ url_for('main.dashboard') }}" class="btn-link">
            ← Back to Dashboard
        </a>

    </div>

</div>

{% endblock %}
