{% extends 'base.html' %}

{% block content %}

<h2 class="page-title">New Journal Entry</h2>
<p class="subtitle">Capture your thoughts and reflect on your day</p>

<div class="form-container">

    <div class="card">

        <!-- Flash Messages -->
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="flash-container">
                    {% for message in messages %}
                        <div class="flash">{{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <form method="POST" class="entry-form">

            <div class="form-group">
                <label>Title</label>
                <input type="text" name="title" placeholder="Give your entry a title" required>
            </div>

            <div class="form-group">
                <label>What’s on your mind?</label>
                <textarea name="content" placeholder="Write your thoughts..." rows="5" required></textarea>
            </div>

            <div class="form-group">
                <label>Mood (1–10)</label>
                <input type="number" name="mood_score" min="1" max="10" required>
            </div>

            <button type="submit" class="btn-primary">Save Entry</button>

        </form>

    </div>

</div>

{% endblock %}
